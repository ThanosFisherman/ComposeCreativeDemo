name: Build and Deploy

on:
  push:
    branches: [master]
    tags: ['v*']      # e.g. v1.0.0 — pushing a tag matching this triggers the Releases job below
  workflow_dispatch: # lets you trigger a run manually from the Actions tab, without a push

# pages/id-token are only needed by the Wasm deploy job — the desktop/Android jobs
# override this down to just "contents: read" for themselves, below.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoids two Pages deploys racing each other if you push twice in quick succession.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------- Web (Wasm) -> GitHub Pages ----------
  # Only runs on pushes to main, not on tag pushes — tagging a release doesn't need to
  # redeploy the same web app again.
  build-wasm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Wasm distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy-wasm:
    needs: build-wasm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------- Desktop -> cross-platform fat jar ----------
  # Runs on every trigger (main pushes, tag pushes, manual dispatch) — cheap enough that
  # having it available as a workflow artifact on ordinary pushes too doesn't hurt.
  build-desktop-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build cross-platform fat jar
        run: ./gradlew :desktopApp:fatJarAllPlatforms

      # Wildcard, since the exact filename depends on your task's archiveFileName config —
      # narrow this to the specific name if your build folder ends up with more than one jar.
      - name: Upload desktop jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-fat-jar
          path: desktopApp/build/libs/*.jar
          retention-days: 30

  # ---------- Android -> debug APK ----------
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ---------- Tag push -> attach both builds to a GitHub Release ----------
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-desktop-jar, build-android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a Release and upload assets to it
    steps:
      - name: Download desktop jar artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-fat-jar
          path: artifacts/desktop

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/desktop/*.jar
            artifacts/android/*.apk